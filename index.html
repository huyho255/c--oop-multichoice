<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cơ sở điện tử y sinh - Trắc nghiệm</title>
    <meta name="description" content="Ứng dụng ôn tập trắc nghiệm môn Cơ sở điện tử y sinh">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav id="tab-nav" class="tab-nav">
        <div class="tab-nav-inner nine-tabs" id="part-tabs">
            <button class="tab-btn active" data-tab="part1"><span class="tab-label">Phần 1</span></button>
            <button class="tab-btn" data-tab="part2"><span class="tab-label">Phần 2</span></button>
            <button class="tab-btn" data-tab="part3"><span class="tab-label">Phần 3</span></button>
            <button class="tab-btn" data-tab="part4"><span class="tab-label">Phần 4</span></button>
            <button class="tab-btn" data-tab="part5"><span class="tab-label">Phần 5</span></button>
            <button class="tab-btn" data-tab="part6"><span class="tab-label">Phần 6</span></button>
            <button class="tab-btn" data-tab="part7"><span class="tab-label">Phần 7</span></button>
            <button class="tab-btn" data-tab="part8"><span class="tab-label">Phần 8</span></button>
            <button class="tab-btn" data-tab="part9"><span class="tab-label">Phần 9</span></button>
        </div>
    </nav>

    <main class="quiz-container">
        <section id="part-panel" class="card tab-panel active">
            <h1 class="glow-text">Cơ sở điện tử y sinh</h1>
            <p class="subtitle" id="part-subtitle">Đang tải dữ liệu câu hỏi...</p>

            <div class="stats-overview">
                <div class="stat-item">
                    <span class="stat-value" id="part-count">0</span>
                    <span class="stat-label">Câu hỏi</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="part-status">—</span>
                    <span class="stat-label">Trạng thái</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">9</span>
                    <span class="stat-label">Phần</span>
                </div>
            </div>

            <div class="smart-info-card">
                <h3 id="part-title">Phần 1</h3>
                <ul id="part-notes">
                    <li>Dữ liệu phần học sẽ được hiển thị theo tab đang chọn.</li>
                </ul>
            </div>

            <div class="btn-group" id="part-actions">
                <button id="continue-btn" class="primary-btn hidden">Làm tiếp bài đang dở</button>
                <button id="start-random-btn" class="primary-btn">Làm 30 câu ngẫu nhiên</button>
                <button id="start-all-btn" class="secondary-btn">Làm toàn bộ phần này</button>
            </div>
        </section>

        <section id="quiz-screen" class="card">
            <header class="quiz-header">
                <button id="back-to-parts-btn" class="ghost-btn back-btn">← Về 9 phần</button>
                <div class="quiz-mode-badge" id="quiz-mode-badge"></div>
                <div class="progress-container">
                    <div class="progress-info">
                        <span id="question-number">Câu 1/30</span>
                        <span id="timer">00:00</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill"></div>
                    </div>
                </div>
            </header>
            <div id="question-container">
                <h2 id="question-text">Đang tải câu hỏi...</h2>
                <div id="options-container" class="options-grid"></div>
            </div>
            <footer class="quiz-footer">
                <button id="next-btn" class="secondary-btn hidden">Tiếp theo →</button>
            </footer>
        </section>

        <section id="result-screen" class="card">
            <h2 class="glow-text">Kết quả</h2>
            <div class="score-circle">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="score-circle-fill" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <text x="18" y="20.35" class="percentage" id="score-text">0%</text>
                </svg>
            </div>
            <div class="result-details">
                <p id="result-message">Đã hoàn thành lượt làm bài.</p>
                <div class="final-stats">
                    <div class="final-stat"><span class="label">Đúng</span><span id="correct-count" class="value positive">0</span></div>
                    <div class="final-stat"><span class="label">Sai</span><span id="wrong-count" class="value negative">0</span></div>
                    <div class="final-stat" id="round-stat"><span class="label">Phần</span><span id="round-result" class="value round-value">1</span></div>
                </div>
                <div class="review-info" id="review-info">
                    <p><span id="wrong-review-count">0</span> câu sai trong lượt này.</p>
                </div>
            </div>
            <div class="btn-group" id="result-buttons"></div>
        </section>
    </main>

    <script src="biomed_questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
